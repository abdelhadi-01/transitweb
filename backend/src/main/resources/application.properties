spring.application.name=transitweb
server.port=8080

# Database - CORRIGEZ LE MOT DE PASSE ICI
spring.datasource.url=jdbc:mysql://localhost:3306/transitweb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logs
logging.level.org.springframework.security=DEBUG
logging.level.com.example.transitweb=DEBUG